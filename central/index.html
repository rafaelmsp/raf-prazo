tle":"Aviso de recebimento — devolução negativa","verified":false,"text":"Certifico que o Aviso de Recebimento (AR) juntado sob o ID [ID DO AR] foi devolvido com a anotação [MOTIVO INFORMADO NO DOCUMENTO], conforme consulta aos autos.","note":"O motivo deve corresponder ao AR. A providência posterior depende do fluxo da serventia."},{"id":"mandado-juntado","group":"Comunicação processual","title":"Mandado devolvido e juntado","verified":false,"text":"Certifico que foi juntado aos autos o mandado sob o ID [ID DO MANDADO], constando no documento o resultado [RESULTADO DESCRITO PELO OFICIAL].","note":"Confira exatamente a certidão do oficial de justiça, sem presumir a eficácia do ato."},{"id":"decurso-prazo","group":"Prazos","title":"Decurso de prazo sem manifestação localizada","verified":false,"text":"Certifico que, após conferência dos registros de intimação e das movimentações processuais, decorreu o prazo referente a [ATO OU DETERMINAÇÃO], encerrado em [DATA], sem manifestação localizada até a presente conferência.","note":"Exige checagem do marco, das partes, das suspensões, da ciência e de eventuais petições. O RAF-PRAZO não certifica o decurso."},{"id":"manifestacao-juntada","group":"Prazos","title":"Manifestação juntada aos autos","verified":false,"text":"Certifico que foi juntada aos autos manifestação de [PARTE], sob o ID [ID DA PETIÇÃO], em [DATA], referente a [ASSUNTO].","note":"Não declare tempestividade sem conferir integralmente o prazo aplicável."},{"id":"conclusao-efetivada","group":"Encaminhamentos","title":"Remessa à conclusão efetuada","verified":false,"text":"Certifico que, após as conferências pertinentes, encaminhei os presentes autos à conclusão para apreciação de [ASSUNTO OU PEDIDO].","note":"Utilize somente quando o encaminhamento à conclusão já tiver sido executado e registrado."},{"id":"central-aud-virtual","title":"Pedido de audiência on-line — conclusão","group":"Pauta","verified":false,"text":"Certifico que, na petição de index [ÍNDICE], consta pedido de realização da audiência na modalidade virtual, estando a audiência designada para o dia [DATA]. Remeto os autos à conclusão.","note":"Sugestão já existente na Central; usar somente após remessa efetiva, conforme orientação."}],CERTLINK={"1":{"status":"none","note":"Organização de escala; não exige certidão própria.","ids":[]},"2":{"status":"none","note":"Planejamento de expediente; não exige certidão própria.","ids":[]},"3":{"status":"conditional","note":"Quando a auditoria resultar em processo regular e a rotina exigir certidão; distinguir modalidade.","ids":["aud-conciliacao","aud-instrucao"]},"4":{"status":"none","note":"Extração de PDF é consulta administrativa.","ids":[]},"5":{"status":"none","note":"Impressão e entrega não constituem certidão processual.","ids":[]},"6":{"status":"none","note":"Passagem de serviço: controle interno.","ids":[]},"7":{"status":"conditional","note":"Se regular e prevista certificação, usar a modalidade correta; outras ocorrências têm ficha própria.","ids":["aud-conciliacao","aud-instrucao"]},"8":{"status":"conditional","note":"Falta de tempo hábil comprovada ou audiência regular, conforme o fato.","ids":["pauta-sem-tempo-despacho","aud-conciliacao","aud-instrucao"]},"9":{"status":"conditional","note":"Registrar somente juntada, cadastro efetivo ou ausência de documento, sem decidir validade dos poderes.","ids":["procuracao-juntada","adv-cadastro","doc-nao-localizado"]},"10":{"status":"direct","note":"Certidão de audiência designada conforme rotina e modalidade.","ids":["aud-conciliacao","aud-instrucao"]},"11":{"status":"conditional","note":"Conferir cada processo individualmente e selecionar o texto conforme o fato.","ids":["aud-conciliacao","aud-instrucao"]},"12":{"status":"conditional","note":"Se regular após revisão; outras ocorrências têm ficha própria.","ids":["aud-conciliacao","aud-instrucao"]},"13":{"status":"conditional","note":"Registrar literalmente resultado do AR quando necessário.","ids":["ar-devolvido"]},"14":{"status":"direct","note":"Modelo de retirada somente após retirada e intimação cabíveis; antes, modelo factual de devolução.","ids":["pauta-ar-negativo-retirada","ar-negativo"]},"15":{"status":"direct","note":"Certificar assinatura por terceiro; conclusão apenas se efetivamente realizada.","ids":["pauta-ar-assinado-terceiro","conclusao-efetivada"]},"16":{"status":"conditional","note":"Registrar recebedor ou resultado, sem presumir validade jurídica.","ids":["ar-devolvido","pauta-ar-assinado-terceiro"]},"17":{"status":"conditional","note":"Limitar ao que não foi localizado; não afirmar devolução negativa.","ids":["doc-nao-localizado"]},"18":{"status":"conditional","note":"Registrar o resultado literal do mandado quando necessário.","ids":["mandado-juntado"]},"19":{"status":"direct","note":"Modelo de retirada somente após retirada e intimação cabíveis; antes, registrar apenas resultado do mandado.","ids":["pauta-oja-negativa-modelo","mandado-juntado"]},"20":{"status":"missing","note":"Não há modelo específico de confirmação eletrônica; não usar AR postal.","ids":[]},"21":{"status":"missing","note":"Não há modelo específico de citação eletrônica pendente.","ids":[]},"22":{"status":"conditional","note":"Certificar documento ou pendência da parte correspondente, se necessário.","ids":["ar-devolvido","mandado-juntado","doc-nao-localizado"]},"23":{"status":"conditional","note":"Registrar manifestação efetivamente juntada, sem afirmar suprimento da citação.","ids":["manifestacao-juntada","peticao-juntada"]},"24":{"status":"missing","note":"Não há modelo específico de carta precatória.","ids":[]},"25":{"status":"direct","note":"Usar texto completo do RAF Prazo após comprovar erro e efetuar remessa à conclusão.","ids":["pauta-siscor-erro-ar"]},"26":{"status":"direct","note":"Modelo fornecido exige erro material e inexistência de tempo hábil para citação; não usar fora dessa hipótese.","ids":["pauta-mandado-erro-material"]},"27":{"status":"none","note":"PAC não é ce cao"]},"52":{"status":"conditional","note":"Escolher motivo comprovado e destino efetivo; outro fundamento exige orientação.","ids":["pauta-ar-negativo-retirada","pauta-oja-negativa-modelo","acordo-pauta","acordo-pauta-juiz-leigo","acordo-pauta-juiza-leiga"]},"53":{"status":"conditional","note":"Somente quando o cancelamento corresponder à retirada pelo motivo do modelo; não há modelo genérico.","ids":["pauta-ar-negativo-retirada","pauta-oja-negativa-modelo","acordo-pauta","acordo-pauta-juiz-leigo","acordo-pauta-juiza-leiga"]},"54":{"status":"missing","note":"Não há certidão específica de redesignação efetivada.","ids":[]},"55":{"status":"conditional","note":"Após designação efetiva, se prevista certificação.","ids":["aud-conciliacao","aud-instrucao"]},"56":{"status":"missing","note":"Não há modelo de conversão em diligência; não confundir com diligência negativa.","ids":[]},"57":{"status":"conditional","note":"Somente para pedido virtual e remessa efetiva; não há modelo específico de alteração realizada.","ids":["central-aud-virtual"]},"58":{"status":"conditional","note":"Se regular aguardando audiência, conforme rotina confirmada do JEC_AGA.","ids":["aud-conciliacao","aud-instrucao"]},"59":{"status":"missing","note":"PEM_SCM precisa de validação; sem modelo específico.","ids":[]},"60":{"status":"missing","note":"VERE não fundamenta certidão por si só; sem modelo específico.","ids":[]},"61":{"status":"none","note":"Minutar ata é tarefa distinta da certificação.","ids":[]},"62":{"status":"none","note":"Aplicação de etiqueta não exige certidão por si só.","ids":[]},"63":{"status":"missing","note":"Não há modelo específico de divergência de tarefa.","ids":[]},"64":{"status":"none","note":"WhatsApp é comunicação complementar; usar certidão do motivo da retirada na ficha respectiva.","ids":[]},"65":{"status":"none","note":"Alerta preventivo não é certidão de retirada efetivada.","ids":[]},"66":{"status":"conditional","note":"Selecionar motivo e destino efetivos; comunicação não substitui certidão.","ids":["pauta-ar-negativo-retirada","pauta-oja-negativa-modelo","acordo-pauta","acordo-pauta-juiz-leigo","acordo-pauta-juiza-leiga"]},"67":{"status":"none","note":"Registro institucional de evidências não é certidão autônoma.","ids":[]},"68":{"status":"conditional","note":"Somente se o erro corresponder exatamente ao arquivamento indevido, SISCOR ou mandado; não atribuir culpa.","ids":["arquivamento-indevido","pauta-siscor-erro-ar","pauta-mandado-erro-material"]},"69":{"status":"none","note":"Relatório de expediente não é certidão processual.","ids":[]},"70":{"status":"missing","note":"Não há modelo específico de suspensão.","ids":[]},"71":{"status":"none","note":"Sigilo não exige certidão por si só.","ids":[]},"72":{"status":"conditional","note":"Registrar petição ou conclusão efetiva, sem afirmar falecimento sem prova.","ids":["peticao-juntada","conclusao-efetivada"]},"73":{"status":"missing","note":"Não há modelo específico de duplicidade.","ids":[]},"74":{"status":"conditional","note":"Somente se arquivamento indevido comprovado; não confundir sentença com arquivamento.","ids":["arquivamento-indevido"]},"75":{"status":"missing","note":"Não há certidão específica de indisponibilidade; observar contingência oficial.","ids":[]},"76":{"status":"missing","note":"Não há modelo de retirada indevida; não confundir com arquivamento.","ids":[]},"77":{"status":"missing","note":"Não há modelo específico de ausência de juiz leigo.","ids":[]},"78":{"status":"conditional","note":"Usar somente se ausência registrada em ata juntada e houver necessidade.","ids":["aud-ata"]},"79":{"status":"missing","note":"Sem modelo específico de ausência de ata; documento não localizado apenas se orientação permitir.","ids":["doc-nao-localizado"]},"80":{"status":"conditional","note":"Certificar ausência conforme ata ou conclusão efetivada, se necessário.","ids":["aud-ata","conclusao-efetivada"]},"81":{"status":"none","note":"Suspensão de expediente não exige certidão individual automaticamente.","ids":[]}};

const REMOVALWHY={"1":{"k":"n","why":"A escala organiza o trabalho; divergência de escala não comprova impedimento processual. Confirme com a equipe."},"2":{"k":"n","why":"A data do expediente serve para planejar a conferência, não para alterar audiência."},"3":{"k":"n","why":"A auditoria identifica pendências; somente o fato específico e a orientação correspondente podem fundamentar retirada."},"4":{"k":"n","why":"A extração é consulta; diferença de filtro ou PDF não altera a audiência no PJe."},"5":{"k":"n","why":"A entrega de uma relação não altera o ato designado. Corrija a versão da pauta e avise alterações reais."},"6":{"k":"n","why":"A troca de responsável pelo trabalho não afeta por si só a audiência."},"7":{"k":"n","why":"Ler os autos é etapa de identificação. Retirada depende do impedimento encontrado, não da auditoria em si."},"8":{"k":"p","why":"Despacho impeditivo ou ato indispensável ainda não cumprido pode inviabilizar a sessão. Verifique teor, prazo, decisão e fluxo autorizado."},"9":{"k":"p","why":"Problema de representação pode exigir regularização ou apreciação, mas não demonstra sozinho que a audiência deva ser retirada."},"10":{"k":"n","why":"Se a conferência revelar situação regular, não há motivo operacional identificado para retirar."},"11":{"k":"n","why":"A forma de preparar certidões não interfere por si só na realização da audiência."},"12":{"k":"n","why":"A segunda conferência serve para detectar fatos novos; eventual retirada deve ter fundamento próprio."},"13":{"k":"n","why":"AR positivo não é motivo de retirada. Se houver divergência, avaliar o caso específico e outras comunicações."},"14":{"k":"r","why":"A devolução negativa pode deixar a parte sem comunicação necessária para comparecer, prejudicando a realização útil da audiência. Verifique outra citação comprovada, manifestação e orientação de retirada/intimação."},"15":{"k":"p","why":"Recebimento por terceiro pode gerar dúvida sobre regularidade da comunicação da pessoa física. Certificar o fato e submeter à apreciação; não retirar só pela assinatura divergente."},"16":{"k":"p","why":"A entrega à pessoa jurídica tem circunstâncias próprias. Só a dúvida documentada exige análise; assinatura de terceiro não determina retirada automaticamente."},"17":{"k":"p","why":"Sem retorno juntado, não se confirma o resultado da comunicação. Verificar expediente e eventual outro meio; ausência do AR não é devolução negativa."},"18":{"k":"n","why":"Mandado cumprido, se pertinente e regular, não justifica retirar. Conferir todos os destinatários."},"19":{"k":"r","why":"A diligência negativa pode impedir que a parte seja comunicada para a audiência. Conferir a certidão do OJA, outras comunicações e orientação aplicável antes de retirar."},"20":{"k":"n","why":"Confirmação eletrônica documentada não justifica retirada por si só; verificar destinatário e demais requisitos."},"21":{"k":"p","why":"A falta de confirmação pode comprometer a comunicação necessária. Verificar prazo, meio alternativo e orientação, sem presumir cancelamento."},"22":{"k":"p","why":"A ausência de comunicação de réu relevante pode comprometer a realização útil do ato; verificar cada parte e submeter à apreciação."},"23":{"k":"p","why":"Comparecimento espontâneo pode alterar a análise da comunicação; verificar circunstâncias e efeitos sob orientação. Não é motivo autônomo de retirada."},"24":{"k":"p","why":"Precatória sem cumprimento comprovado pode deixar comunicação indispensável pendente; verificar situação, necessidade do ato e orientação."},"25":{"k":"r","why":"Erro comprovado na expedição do AR pode impedir a comunicação correta ou tempestiva. Certificar e encaminhar à conclusão conforme rotina; retirada depende do impacto e autorização."},"26":{"k":"r","why":"Erro material no mandado, quando impede citação correta e não há tempo hábil para corrigir, pode inviabilizar a audiência. Confirmar erro, prazo e possibilidade de outra comunicação."},"27":{"k":"p","why":"Comunicação determinada e ainda não cumprida pode afetar a sessão. O PAC por si só não é motivo de retirada; avaliar tempo e ordem judicial."},"28":{"k":"p","why":"Contestação ou pedido incidental pode exigir apreciação prévia, mas a defesa juntada não cancela a audiência automaticamente."},"29":{"k":"n","why":"Habilitação de advogado não é por si só impedimento à audiência; se houver questão específica de representação, submeter à supervisão."},"30":{"k":"n","why":"Desabilitação de advogado não implica cancelamento automático; verificar efeitos sobre futuras comunicações."},"31":{"k":"n","why":"Substabelecimento não é motivo autônomo de retirada; conferir cadeia de poderes e eventual questão específica."},"32":{"k":"p","why":"Renúncia pode afetar representação e comunicações, conforme circunstâncias e decisão. Não retirar apenas pela petição."},"33":{"k":"p","why":"A desistência pode tornar a audiência desnecessária se houver decisão ou orientação aplicável. A simples petição não equivale a extinção."},"34":{"k":"p","why":"Emenda ou aditamento pode exigir nova comunicação ou apreciação prévia; só alterar a pauta se houver impacto concreto e autorização."},"35":{"k":"p","why":"Pedido de desentranhamento exige apreciação, mas não impede necessariamente a audiência. Verificar conteúdo e decisão."},"36":{"k":"n","why":"Cumprir desentranhamento não cancela audiência por si só; se houver ordem específica sobre a pauta, seguir essa determinação."},"37":{"k":"p","why":"Pedido de redesignação busca alterar a data, mas somente decisão ou determinação autorizada permite retirar o ato anterior."},"38":{"k":"p","why":"Pedido de audiência on-line diz respeito à modalidade. Encaminhar ao Gabinete 1 conforme rotina; a audiência continua designada até orientação. Alterar modalidade não é necessariamente retirar a pauta."},"39":{"k":"r","why":"Acordo integral pode tornar desnecessária a tentativa de conciliação, mas é preciso conferir alcance, representação, destino e autorização de retirada; acordo juntado não equivale a homologação."},"40":{"k":"r","why":"Homologação que resolve integralmente a controvérsia pode tornar a audiência sem objeto. Ler a decisão e conferir se há ato remanescente ou comando específico."},"41":{"k":"p","why":"Acordo parcial pode deixar pedidos ou partes ainda sujeitos à audiência. Não retirar integralmente sem avaliação do alcance e autorização."},"42":{"k":"n","why":"A regra local das 72 horas trata do destino do acordo, não constitui fundamento autônomo de retirada. Confirmar marco e exceções com a chefia."},"43":{"k":"r","why":"A retirada decorre do acordo e da autorização aplicável, não do simples destino ao titular. Conferir que o acordo abrange a audiência e que a remessa foi efetivada."},"44":{"k":"r","why":"A retirada decorre do acordo e da autorização aplicável, não do simples destino ao juiz leigo. Confirmar alcance, responsável e regra interna."},"45":{"k":"r","why":"O acordo de última hora pode tornar a sessão desnecessária, mas o horário e a situação real do ato exigem comunicação imediata e orientação antes de alterar."},"46":{"k":"p","why":"Tutela pendente exige prioridade de apreciação, mas não constitui automaticamente impedimento à audiência. Encaminhar ao Gabinete 6 conforme rotina; só retirar se houver motivo concreto e autorização."},"47":{"k":"p","why":"Reconsideração de tutela pode exigir decisão urgente, mas não cancela audiência por si só. Conferir efeito da decisão e encaminhamento ao G6."},"48":{"k":"r","why":"Quando despacho indispensável não pode ser cumprido antes da sessão, a audiência pode ficar inviável ou prematura. Demonstrar qual ato falta e por que o tempo é insuficiente; obter orientação."},"49":{"k":"p","why":"Despacho pendente pode afetar audiência se o ato for indispensável e não puder ser cumprido em tempo. A simples pendência não basta."},"50":{"k":"n","why":"Conclusão é encaminhamento para apreciação, não cancelamento. Só retirar por fundamento independente ou decisão aplicável."},"51":{"k":"n","why":"Processo apto e sem impedimento deve permanecer na pauta conforme a rotina de conferência."},"52":{"k":"r","why":"Retirada precisa de motivo concreto documentado (por exemplo, comunicação frustrada indispensável, acordo ou ordem). Não basta a conveniência da serventia; confirmar fundamento e autorização."},"53":{"k":"r","why":"Cancelar audiência é efetivar uma alteração autorizada por fundamento identificado nos autos. Confirmar que a ordem alcança exatamente a audiência designada."},"54":{"k":"r","why":"Redesignação autorizada substitui a data anterior; retirar a antiga relação evita duplicidade. Confirmar a nova data e comunicações, sem confundir com cancelamento sem nova data."},"55":{"k":"n","why":"Designar nova audiência não implica retirar outra automaticamente; confirmar inexistência de duplicidade ou ordem para alteração anterior."},"56":{"k":"p","why":"Converter audiência em diligência modifica o fluxo conforme determinação própria; não é motivo genérico de cancelamento. Verificar efeitos sobre a data designada."},"57":{"k":"p","why":"Alterar modalidade pode preservar data e audiência; somente retirar se a determinação ou operação autorizada exigir mudança da pauta."},"58":{"k":"n","why":"JEC_AGA é uma tarefa; sua presença ou ausência não constitui motivo autônomo de retirada. Conferir situação real."},"59":{"k":"p","why":"PEM_SCM precisa de esclarecimento interno. A sigla isolada não comprova impedimento nem justifica retirar."},"60":{"k":"p","why":"VERE precisa de esclarecimento interno. Não presumir impedimento pela marcação."},"61":{"k":"n","why":"Minutar Ata de Audiência é tarefa relacionada ao ato, não motivo para retirá-lo."},"62":{"k":"n","why":"Etiqueta processual não determina retirada. Verificar o fato e a decisão que ela representa."},"63":{"k":"p","why":"Divergência entre tarefa e pauta pode indicar movimentação incompleta, mas não prova que a audiência esteja cancelada."},"64":{"k":"n","why":"O aviso de WhatsApp documenta comunicação, não fundamenta retirada; deve indicar o motivo concreto apurado."},"65":{"k":"n","why":"Alerta de possível retirada comunica risco, não autoriza nem comprova cancelamento."},"66":{"k":"r","why":"Após retirada efetiva, a relação entregue fica desatualizada; corrigir a lista e comunicar o fundamento original, não criar outro motivo."},"67":{"k":"n","why":"Registro de evidências documenta os atos; não é fundamento autônomo para retirar."},"68":{"k":"p","why":"Erro preexistente só justifica avaliar retirada se comprometer ato indispensável ou houver determinação específica. Registrar o erro concreto sem atribuir culpa."},"69":{"k":"n","why":"Fechar relatório não altera status da audiência; reconciliar pendências sem retirar para fechar números."},"70":{"k":"r","why":"Suspensão vigente pode impedir a realização da audiência se sua abrangência alcançar o ato. Ler a decisão, conferir exceções e autorização."},"71":{"k":"n","why":"Segredo de justiça restringe acesso e comunicação, mas não é impedimento automático à audiência."},"72":{"k":"p","why":"Falecimento pode exigir regularização da parte ou suspensão, conforme apreciação. Não cancelar por notícia isolada."},"73":{"k":"r","why":"Duplicidade comprovada pode demandar exclusão do registro incorreto para evitar duas sessões; identificar exatamente qual ato permanece e obter autorização."},"74":{"k":"r","why":"Sentença que resolve o objeto pode tornar audiência desnecessária, mas conferir alcance, atos remanescentes e determinação antes de retirar."},"75":{"k":"p","why":"Indisponibilidade pode impedir providências essenciais ou a sessão; seguir contingência oficial e verificar orientação. Não anunciar retirada não confirmada."},"76":{"k":"p","why":"Retirada indevida exige correção e comunicação imediata; não é fundamento para nova retirada. Preservar registro e obter orientação."},"77":{"k":"p","why":"Ausência do juiz leigo pode exigir substituição ou redesignação; conferir escala e orientação. Não cancelar automaticamente."},"78":{"k":"n","why":"Ausência registrada em audiência já realizada deve seguir a ata e deliberação; não é motivo retroativo de retirada da pauta."},"79":{"k":"p","why":"Ata não juntada gera dúvida documental, não prova que a audiência deixou de ocorrer. Confirmar situação com a equipe."},"80":{"k":"n","why":"Tratamento pós-audiência segue resultado formal; não retirar retroativamente ato realizado para encerrar tarefa."},"81":{"k":"r","why":"Suspensão oficial do expediente pode inviabilizar a sessão quando abranger a unidade e data; confirmar ato oficial e orientação sobre alteração."}};
const WHY_LABEL={r:'Possível fundamento de retirada — confirmar',p:'Pendência ou risco — não retirar automaticamente',n:'Não é fundamento autônomo de retirada'};
function whyPanel(x){let j=REMOVALWHY[x.id];return '<section class="panel why-panel why-'+j.k+'"><div class="row between"><h3>Por que retirar ou manter a audiência?</h3><span class="tag '+(j.k==='n'?'':'pending')+'">'+esc(WHY_LABEL[j.k])+'</span></div><p>'+esc(j.why)+'</p><p class="muted"><b>Antes de alterar:</b> conferir o fato, documento/ID, data e horário, decisão ou rotina autorizada e eventual outra comunicação. Se houver risco concreto, avisar individualmente no WhatsApp autorizado com motivo, dia e horário; após retirada efetiva, confirmar em novo aviso. A justificativa é explicação operacional, não autorização judicial.</p></section>'}
function linkedCerts(x){let l=CERTLINK[x.id],ms=l.ids.map(id=>CERTCAT.find(m=>m.id===id));return '<section class="panel" style="margin:14px 0"><div class="row between"><h3>Certidões aplicáveis ao procedimento</h3><span class="tag '+(l.status==='missing'?'pending':'')+'">'+esc(CERTSTATUS[l.status])+'</span></div><p>'+esc(l.note)+'</p>'+ms.map(certCard).join('')+'<p class="muted">Modelo fornecido indica origem no catálogo, não aprovação institucional. Confira os fatos, complete os campos e observe a supervisão. Não declare retirada, intimação, remessa ou ato ainda não efetuado.</p></section>'}

let fxCat=-1,fxQuery='',fxChecks={},fxDecision=null;
const FXALL=[['verify','Conferência'],['decision','Decisão'],['execute','Providência'],['notify','Comunicação'],['done','Revisão']];
function fxClear(){fxChecks={};fxDecision=null}
function fxItems(){let q=norm(fxQuery).trim().split(/\s+/).filter(Boolean);return D.filter(x=>(fxCat<0||x.cat===fxCat)&&q.every(w=>norm([x.title,x.tags,C[x.cat][0],x.dest].join(' ')).includes(w)))}
function fxNav(){let e=$('fxlist');if(!e)return;let ar=fxItems();e.innerHTML='<p class="muted">'+ar.length+' procedimentos</p>'+ar.map(x=>'<button class="'+(id===x.id?'active':'')+'" data-act="fxselect" data-val="'+x.id+'"><span class="num">'+String(x.id).padStart(2,'0')+'</span><span>'+esc(x.title)+'</span></button>').join('')+(ar.length?'':'<p class="muted">Nenhum resultado. Altere os filtros.</p>')}
function fxView(){return '<div class="fxhead"><div class="eyebrow" style="color:#b9d2fa">RAF • PROCESS MANAGEMENT / v1.5</div><h1>Fluxos operacionais</h1><p>Localize uma ocorrência, visualize o caminho no PJe, compare decisões e acompanhe as etapas de conferência.</p><div class="fxstats"><span class="fxpill">'+D.length+' fluxos</span><span class="fxpill">10 categorias</span><span class="fxpill">Roteiro + decisão + controle</span></div></div>'+notice+'<div class="fxlegend">'+FXALL.map((v,i)=>'<span><i class="dot" style="--f:'+['#477cd0','#dc992e','#805cc8','#c35d47','#23956c'][i]+'"></i>'+esc(v[1])+'</span>').join('')+'</div><div class="fxlayout"><aside class="panel fxnav"><h3>Biblioteca de processos</h3><button data-act="fxgeneral" style="width:100%;margin-bottom:10px">⇢ Fluxo geral da pauta</button><input class="search" id="fxsearch" placeholder="Buscar AR, acordo, on-line…" value="'+esc(fxQuery)+'" aria-label="Pesquisar fluxos"><select id="fxcat" aria-label="Filtrar categoria"><option value="-1">Todas as categorias</option>'+C.map((c,i)=>'<option value="'+i+'" '+(fxCat===i?'selected':'')+'>'+esc(c[0])+'</option>').join('')+'</select><div class="fxlist" id="fxlist"></div></aside><section class="fxbody" id="flowdetail">'+flowDetail()+'</section></div>'}
function lane(cls,n,title,body){return '<section class="fxlane '+cls+'"><div class="phase">'+esc(n)+'</div><h3>'+esc(title)+'</h3>'+body+'</section>'}
function connector(){return '<div class="fxconnector" aria-hidden="true">↓</div>'}
function fxRoute(r){return '<div class="fxroute">'+FXROUTES[r].map((v,i)=>(i?'<i>›</i>':'')+'<span>'+esc(v)+'</span>').join('')+'</div><p class="muted">'+esc(FXNOTES[r])+'</p>'}
function fxSteps(x){return x.steps.filter(t=>!/^Ao identificar possível retirada|^Se a retirada for autorizada e efetivada|^Se houver risco concreto de retirada ou alteração/i.test(t)&&!/^(avisar retirada|avisar\.?|comunicar\.?|comunicar individualmente)$/i.test(t.trim()))}
function fxChecksHtml(items){return items.map((t,i)=>'<label class="fxstep"><input type="checkbox" data-fxcheck="'+i+'" '+(fxChecks[i]?'checked':'')+'><span class="stepno">'+String(i+1).padStart(2,'0')+'</span><span>'+esc(t)+'</span></label>').join('')}
function fxProgress(){let e=$('fxprogress'),bar=$('fxbar');if(!e||!bar)return;let count=fxSteps(find(id)).length,n=Object.values(fxChecks).filter(Boolean).length;e.textContent=n+' / '+count+' etapas de estudo';bar.style.width=(count?100*n/count:0)+'%'}
function fxBranches(p){return '<p><b>'+esc(p.question)+'</b></p><div class="fxbranch"><button class="yes '+(fxDecision==='yes'?'selected':'')+'" data-act="fxbranch" data-val="yes"><b>✓ SIM</b>'+esc(p.yes)+'</button><button class="no '+(fxDecision==='no'?'selected':'')+'" data-act="fxbranch" data-val="no"><b>◇ NÃO / NÃO CONFIRMADO</b>'+esc(p.no)+'</button></div><div id="fxdecisionout">'+(fxDecision?'<div class="fxdecisionout"><b>Ramo selecionado para estudo:</b> '+esc(p[fxDecision])+'<br>Não constitui autorização para movimentar o PJe.</div>':'<p class="muted">Selecione um ramo para estudar o encaminhamento.</p>')+'</div>'}
function fxComms(){return '<div class="fxalert"><b>Antes: possível retirada</b><br>Identificou risco concreto de retirada? Avise individualmente no grupo de WhatsApp autorizado, com motivo objetivo, dia e horário da audiência. Declare que ainda está designada, se for o caso.</div><div class="fxalert"><b>Depois: retirada efetivada</b><br>Confirme no PJe e envie novo aviso com motivo, dia, horário da audiência e horário real da retirada. Se mantida, informe o desfecho. Registre ambas as comunicações no controle institucional.</div><div class="row">'+btn('Copiar aviso preventivo','copy',templates[0][1])+btn('Copiar aviso confirmado','copy',templates[1][1])+btn('Protocolo completo','nav','protocol')+'</div>'}

let dgMode='diagram',dgZoom=1,dgChoice='all',dgGeneral=false;
function dgWrap(t,max){let a=[],line='';for(let word of String(t).split(/\s+/)){if(!word)continue;while(word.length>max){if(line){a.push(line);line=''}a.push(word.slice(0,max));word=word.slice(max)}if((line+' '+word).trim().length>max){a.push(line);line=word}else line=(line+' '+word).trim()}if(line)a.push(line);return a}
function dgText(x,y,lines,size=13,weight=500){return '<text x="'+x+'" y="'+y+'" text-anchor="middle" font-size="'+size+'" font-weight="'+weight+'">'+lines.map((l,i)=>'<tspan x="'+x+'" dy="'+(i?size*1.35:0)+'">'+esc(l)+'</tspan>').join('')+'</text>'}
function dgBox(x,y,w,title,body,kind,cls=''){let lines=dgWrap(body,Math.max(16,Math.floor((w-28)/7))),heads=dgWrap(title,Math.max(16,Math.floor((w-28)/8))),h=25+heads.length*19+lines.length*17+17;return {h,svg:'<g class="'+cls+'"><rect class="nodebox node'+kind+'" x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="12"/><rect x="'+(x+1)+'" y="'+(y+10)+'" width="5" height="'+(h-20)+'" rx="2" fill="'+({blue:'#477cd0',purple:'#805cc8',orange:'#d28b27',red:'#c35d47',green:'#23956c'}[kind])+'"/>'+dgText(x+w/2,y+24,heads,14,750)+dgText(x+w/2,y+24+heads.length*19,lines,13,500)+'</g>'}}
function dgEdge(d,kind='',cls=''){return '<path class="edge '+kind+' '+cls+'" d="'+d+'" marker-end="url(#dgarr'+(kind==='yesedge'?'yes':kind==='noedge'?'no':'')+')"/>'}
function dgTerm(y,t,fill){return '<rect x="340" y="'+y+'" width="260" height="38" rx="19" fill="'+fill+'"/><text x="470" y="'+(y+24)+'" text-anchor="middle" font-size="13" font-weight="750" style="fill:white">'+esc(t)+'</text>'}
function dgDiamond(y,q){let lines=dgWrap(q,34),half=Math.max(70,lines.length*10+34),cy=y+half;return {h:2*half,cy,svg:'<path class="nodebox nodeorange" d="M470 '+y+' L700 '+cy+' L470 '+(y+2*half)+' L240 '+cy+' Z"/>'+dgText(470,cy-(lines.length-1)*9+4,lines,13,700)}}
function flowDiagramSVG(x, general=false){let p=general?{route:'pauta',question:'Há pendência ou impedimento que afeta a audiência?',yes:'Identificar a ocorrência, consultar o fluxo específico e solicitar orientação. Não retirar automaticamente.',no:'Certificar quando cabível, manter a audiência e revisar os demais requisitos.'}:FXPLAN[x.id];let route=general?'Painel do Usuário › Audiências e Sessões › Pauta de Audiência; abrir os Autos Digitais para conferir cada processo.':FXROUTES[p.route].join(' › ');let recog=general?'Conferir escala, sala, data e horário; ler árvore processual, decisões, petições e comunicações.':x.recognize+' '+REMOVALWHY[x.id].why;

// Segunda decisão explícita: somente o ramo com risco gera alerta preventivo.
di=dgDiamond(y,'Existe possibilidade concreta de retirada da pauta?');parts.push(di.svg);by=y+di.h+29;let pre=dgBox(20,by,400,'SIM · Aviso preventivo no WhatsApp','Informar motivo objetivo, dia e horário da audiência; esclarecer que permanece designada enquanto pendente.','red'),skip=dgBox(520,by,400,'NÃO · Continuar a conferência','Manter o status da audiência; não anunciar retirada inexistente.','green');parts.push(pre.svg,skip.svg);edges.push(dgEdge('M240 '+di.cy+' H220 V'+by,'yesedge'),dgEdge('M700 '+di.cy+' H720 V'+by,'noedge'));parts.push('<text class="branchlabel yeslabel" x="211" y="'+(by-8)+'" text-anchor="end">SIM</text><text class="branchlabel nolabel" x="729" y="'+(by-8)+'">NÃO</text>');merge=Math.max(by+pre.h,by+skip.h)+25;edges.push(dgEdge('M220 '+(by+pre.h)+' V'+merge+' H470 V'+(merge+24)),dgEdge('M720 '+(by+skip.h)+' V'+merge+' H470 V'+(merge+24)));y=merge+24;n=dgBox(160,y,620,'03 · Providência no PJe','Somente se houver determinação ou autorização aplicável. '+(general?'Cumprir a rotina específica: certidão, PAC, conclusão ou gerenciamento de audiência.': 'Destino: '+x.dest+' Consultar o passo a passo e conferir o resultado.'),'purple');parts.push(n.svg);y+=n.h;edges.push(dgEdge('M470 '+y+' V'+(y+25)));y+=25;di=dgDiamond(y,'A retirada foi autorizada e efetivada no PJe?');parts.push(di.svg);by=y+di.h+28;let post=dgBox(20,by,400,'SIM · Confirmação no WhatsApp','Novo aviso: motivo, dia e horário da audiência, horário da retirada efetiva; registrar as comunicações.','red'),keep=dgBox(520,by,400,'NÃO · Manutenção ou pendência','Não declarar retirada. Se houve alerta anterior, comunicar o desfecho ou manter a pendência em acompanhamento.','green');parts.push(post.svg,keep.svg);edges.push(dgEdge('M240 '+di.cy+' H220 V'+by,'yesedge'),dgEdge('M700 '+di.cy+' H720 V'+by,'noedge'));parts.push('<text class="branchlabel yeslabel" x="211" y="'+(by-8)+'" text-anchor="end">SIM</text><text class="branchlabel nolabel" x="729" y="'+(by-8)+'">NÃO</text>');merge=Math.max(by+post.h,by+keep.h)+25;edges.push(dgEdge('M220 '+(by+post.h)+' V'+merge+' H470 V'+(merge+23)),dgEdge('M720 '+(by+keep.h)+' V'+merge+' H470 V'+(merge+23)));y=merge+23;n=dgBox(160,y,620,'04 · Controle de qualidade','Revisar status da audiência, tarefa, certidão, pauta e relatório. Registrar fatos e horários reais em controle autorizado.','green');parts.push(n.svg);y+=n.h;edges.push(dgEdge('M470 '+y+' V'+(y+25)));y+=25;parts.push(dgTerm(y,'FIM · REVISAR PENDÊNCIAS','#29486c'));y+=50;
return '<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="'+esc(general?'Fluxograma geral da pauta':'Fluxograma de '+x.title)+'" viewBox="0 0 940 '+y+'" style="width:'+Math.round(940*dgZoom)+'px" ><title>'+esc(general?'Gestão de pauta':x.title)+'</title><defs><marker id="dgarr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8491a3"/></marker><marker id="dgarryes" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#23956c"/></marker><marker id="dgarrno" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#d28b27"/></marker></defs>'+edges.join('')+parts.join('')+'</svg>'}
function dgCurrent(){return flowDiagramSVG(find(id),dgGeneral)}

function dgRender(){let e=$('flowdetail');if(!e)return;e.innerHTML=dgGeneral?fxGeneral():flowDetail()}
function flowDetail(){dgGeneral=false;let x=find(id),p=FXPLAN[x.id],steps=fxSteps(x);if(!p)return '<p>Fluxo indisponível.</p>';return '<div class="panel fxshort"><div class="fxdetailhead"><div><span class="tag">PROC '+String(x.id).padStart(2,'0')+' · '+esc(C[x.cat][0])+'</span><h2>'+esc(x.title)+'</h2><p class="muted">'+esc(x.dest)+'</p></div><span class="tag '+(x.status==='validar'?'pending':'')+'">'+(x.status==='validar'?'Validar com chefia':'Referência de estudo')+'</span></div><div id="fxprogress" class="muted">'+Object.values(fxChecks).filter(Boolean).length+' / '+steps.length+' etapas de estudo</div><div class="fxbar"><i id="fxbar" style="width:'+100*Object.values(fxChecks).filter(Boolean).length/Math.max(1,steps.length)+'%"></i></div><div class="fxphasebar"><span>01 Conferir</span><span>02 Decidir</span><span>03 Executar</span><span>04 Comunicar</span><span>05 Revisar</span></div><div class="row">'+btn('Reiniciar etapas','fxreset')+btn('Abrir ficha','open',x.id)+btn('Imprimir fluxo','fxprint')+'</div>'+dgTabs()+'</div>'+dgPanel()+whyPanel(x)+linkedCerts(x)+'<div class="dgsteps" '+(dgMode==='diagram'?'hidden':'')+'>'+lane('verify','01 / entrada e conferência','O que abrir no PJe','<p>'+esc(x.recognize)+'</p>'+fxRoute(p.route))+connector()+lane('decision','02 / ponto de decisão','Qual caminho seguir?',fxBranches(p))+connector()+lane('notify','03 / alerta preventivo quando houver risco','Possível retirada de pauta','<p>Se houver possibilidade concreta de retirar, informe o grupo autorizado de WhatsApp: motivo, dia e horário da audiência; indique que ainda está pendente. Não aguarde a retirada para alertar quando o risco for identificado.</p>'+btn('Copiar aviso de possível retirada','copy',templates[0][1]))+connector()+lane('execute','04 / execução sob supervisão','Procedimento passo a passo',fxChecksHtml(steps)+'<p class="muted"><b>Destino:</b> '+esc(x.dest)+'</p><div class="notice"><b>Não fazer:</b> '+esc(x.warn)+'</div>')+connector()+lane('notify','05 / comunicação e controle','Confirmação do resultado',fxComms())+connector()+lane('done','06 / verificação final','Conferir antes de encerrar','<p>Verifique árvore, tarefa, status da audiência, comunicações e relação atualizada. Registre horários reais e pendências. Se não houve retirada, não marque como efetivada. Não insira dados processuais nesta central pública.</p><div class="row">'+btn('Checklist de auditoria','nav','audit')+btn('Próximo procedimento','fxnext')+'</div>')+'</div>'}
function fxGeneral(){dgGeneral=true;return '<div class="panel"><span class="tag">MAPA GERAL</span><h2>Gestão de pauta — ponta a ponta</h2><p class="muted">Da preparação à entrega e ao controle de ocorrências.</p>'+dgTabs()+'</div>'+dgPanel()+'<div class="dgsteps" '+(dgMode==='diagram'?'hidden':'')+'>'+lane('verify','01 / planejar','Extrair a pauta no PJe',fxRoute('pauta')+'<p>Confira escala, data, sala e total. Sexta: pauta de segunda, salvo calendário oficial.</p>'+btn('Abrir extração','fxselect',4))+connector()+lane('verify','02 / auditar','Conferir autos e documentos',fxRoute('autos')+'<p>Leia última certidão, despacho, comunicações e petições posteriores. Confira todos os réus.</p>'+btn('Abrir leitura da árvore','fxselect',7))+connector()+lane('decision','03 / decidir','Há pendência ou impedimento?','<div class="fxbranch"><button class="yes" data-act="fxselect" data-val="52"><b>SIM — possível retirada</b>Comunique o risco, registre o motivo e consulte a autorização. Não retire automaticamente.</button><button class="no" data-act="fxselect" data-val="10"><b>NÃO — regular</b>Certifique e mantenha, se o processo estiver apto.</button></div>')+connector()+lane('execute','04 / executar','Providência autorizada','<div class="row">'+btn('Conclusão','fxselect',50)+btn('PAC','fxselect',27)+btn('Gerenciar audiência','fxselect',52)+btn('Tutela G6','fxselect',46)+btn('Audiência on-line G1','fxselect',38)+'</div>')+connector()+lane('notify','05 / comunicar','Aviso preventivo e confirmação',fxComms())+connector()+lane('done','06 / encerrar','Segunda conferência e entrega','<p>Reconcilie números processuais, alterações e avisos; atualize a pauta e relatório. Controle pendências.</p>'+btn('Segunda conferência','fxselect',12)+' '+btn('Relatório final','fxselect',69))+'</div>' }
function drawDecision(){let e=$('decisiondetail');if(!scenario){e.innerHTML='<p class="muted">Escolha uma situação para ver o roteiro.</p>';return}let x=find(scenario);e.innerHTML='<h2>'+esc(x.title)+'</h2><p>'+esc(x.recognize)+'</p><ol class="steps">'+x.steps.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ol><p><b>Destino:</b> '+esc(x.dest)+'</p><div class="notice">'+esc(x.warn)+'</div>'+communicationRule+'<h3>A audiência será alterada?</h3><div class="row">'+btn('Não / ainda incerto','decisionanswer','no')+btn('Sim, com autorização','decisionanswer','yes')+'</div><div id="answerflow"></div>'+whyPanel(x)+linkedCerts(x)+btn('Abrir ficha completa','open',x.id)}
function checkPanel(items,title){return '<div class="panel"><h2>'+esc(title)+'</h2><div id="checkcount" class="muted"></div><div class="meter"><span id="checkbar"></span></div>'+items.map((s,i)=>'<label class="check"><input type="checkbox" data-check="'+i+'" '+(check[i]?'checked':'')+'><span>'+esc(s)+'</span></label>').join('')+'<div id="checkwarn"></div><div class="row" style="margin-top:12px">'+btn('Reiniciar checklist','resetcheck')+'</div></div>'}
function updateCheck(){let items=view==='protocol'?removal:audit,n=items.filter((s,i)=>check[i]).length;$('checkcount').textContent=n+' de '+items.length+' etapas de estudo';$('checkbar').style.width=(n/items.length*100)+'%';$('checkwarn').innerHTML=view==='protocol'&&check[5]&&(!check[2]||!check[7])?'<div class="notice">Atenção: comunicação preventiva ou confirmação de retirada pendente. Informe motivo, dia e horário da audiência; registre os horários reais.</div>':n===items.length?'<p style="color:var(--good)">Checklist completo nesta simulação.</p>':''}
function quizSet(){return D.filter(x=>quizMode<0||x.cat===quizMode)}
function quizHtml(){let set=quizSet(),x=set[qa%set.length],wrong=D.filter(y=>y.cat!==x.cat&&y.id!==x.id);let options=[x.steps[0]+'. '+x.warn,wrong[(x.id*3)%wrong.length].steps[0]+'. Encerrar sem verificar o caso.', 'Alterar a pauta imediatamente sem conferir autorização, documentos ou status.'];let shift=x.id%3;options=options.slice(shift).concat(options.slice(0,shift));let correct=(3-shift)%3;let n=set.filter(y=>saved.answers[y.id]===true).length;return '<p class="muted">Caso '+(qa%set.length+1)+' de '+set.length+' · '+n+' já acertados nesta categoria</p><div class="meter"><span style="width:'+n/set.length*100+'%"></span></div><h3>Você encontrou: '+esc(x.title)+'</h3><p>'+esc(x.recognize)+'</p><p><b>Qual é a conduta inicial mais segura?</b></p>'+options.map((s,i)=>btn(String.fromCharCode(65+i)+'. '+s,'quizanswer',i,'answer '+(answered!==null&&i===correct?'correct':answered===i?'incorrect':''))).join('')+(answered!==null?'<div class="notice">'+(answered===correct?'Correto. ':'Reveja a resposta. ')+esc(x.dest)+' '+esc(x.warn)+'</div>'+btn('Ver ficha','open',x.id)+' '+btn('Próxima questão','nextquiz','', 'primary'):'')}
async function copy(s){try{await navigator.clipboard.writeText(s);toast('Modelo copiado.')}catch(e){let t=document.createElement('textarea');t.value=s;document.body.append(t);t.select();let ok=document.execCommand('copy');t.remove();toast(ok?'Modelo copiado.':'Não foi possível copiar; selecione o texto manualmente.')}}
document.addEventListener('click',e=>{let b=e.target.closest('[data-act]');if(!b)return;let a=b.dataset.act,v=b.dataset.val;switch(a){case'nav':go(v);break;case'category':cat=Number(v);query='';onlyFav=false;go('library');break;case'open':id=Number(v);cat=-1;query='';onlyFav=false;go('library');break;case'detail':id=Number(v);drawLibrary();if(innerWidth<801)$('detail').scrollIntoView({block:'start'});break;case'copy':copy(v);break;case'favorite':saved.fav[v]=!saved.fav[v];save();drawLibrary();break;case'seen':saved.seen[v]=!saved.seen[v];save();drawLibrary();break;case'flow':id=Number(v);fxCat=-1;fxQuery='';go('flows');break;case'fxselect':id=Number(v);dgChoice='all';fxClear();$('flowdetail').innerHTML=flowDetail();fxNav();if(innerWidth<1001)$('flowdetail').scrollIntoView({block:'start'});break;case'fxgeneral':dgChoice='all';fxClear();$('flowdetail').innerHTML=fxGeneral();break;case'fxbranch':fxDecision=v;$('flowdetail').innerHTML=flowDetail();break;case'fxreset':fxClear();$('flowdetail').innerHTML=flowDetail();break;case'fxnext':id=id%D.length+1;fxCat=-1;fxQuery='';fxClear();render();break;case'fxprint':window.print();break;case'dgmode':dgMode=v;dgRender();break;case'dgbranch':dgChoice=v;dgRender();break;case'dgzoom':{let canvas=$('dgcanvas');if(v==='fit')dgZoom=Math.max(.28,Math.min(1,((canvas?.clientWidth||650)-24)/940));else dgZoom=Math.max(.3,Math.min(2,dgZoom+(v==='in'?.15:-.15)));if(canvas)canvas.innerHTML=dgCurrent();if($('dgzoomlabel'))$('dgzoomlabel').textContent=Math.round(dgZoom*100)+'%';break}case'dgprint':{let old=dgMode;dgMode='diagram';dgRender();window.print();dgMode=old;dgRender();break}case'resetcheck':check={};render();break;case'decisionanswer':$('answerflow').innerHTML=v==='yes'?'<div class="notice">Confirme autorização e ato correto, verifique o resultado no PJe. Se houver possível retirada, avise com motivo, dia e horário da audiência; após efetivação, confirme em novo aviso e registre.</div>'+btn('Abrir protocolo','nav','protocol'):'<div class="notice">Mantenha o status até orientação. Se houver possível retirada, avise no grupo autorizado com motivo, dia e horário da audiência, sem afirmar retirada.</div>';break;case'quizanswer':if(answered!==null)return;let x=quizSet()[qa%quizSet().length];answered=Number(v);saved.answers[x.id]=answered===(3-x.id%3)%3;save();$('quizdetail').innerHTML=quizHtml();break;case'nextquiz':qa=(qa+1)%quizSet().length;answered=null;$('quizdetail').innerHTML=quizHtml();break;case'resetquiz':qa=0;answered=null;$('quizdetail').innerHTML=quizHtml();break}});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;drawLibrary()}else if(e.target.id==='fxsearch'){fxQuery=e.target.value;fxNav()}});
document.addEventListener('change',e=>{let t=e.target;if(t.id==='cat'){cat=Number(t.value);drawLibrary()}else if(t.id==='fav'){onlyFav=t.checked;drawLibrary()}else if(t.id==='fxcat'){fxCat=Number(t.value);fxNav()}else if(t.dataset.fxcheck!==undefined){fxChecks[Number(t.dataset.fxcheck)]=t.checked;fxProgress()}else if(t.id==='decisionpick'){scenario=Number(t.value)||null;drawDecision()}else if(t.id==='quizcat'){quizMode=Number(t.value);qa=0;answered=null;$('quizdetail').innerHTML=quizHtml()}else if(t.dataset.check!==undefined){check[Number(t.dataset.check)]=t.checked;updateCheck()}});
