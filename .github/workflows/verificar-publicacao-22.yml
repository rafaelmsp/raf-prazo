name: Raf-Prazo 2.2 - Site Publicado
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verificar interface e script públicos
        run: |
          set -e
          BASE="https://rafaelmsp.github.io/raf-prazo"
          for attempt in 1 2 3 4 5 6 7 8; do
            echo "Conferindo publicação do Raf-Prazo 2.3 — tentativa $attempt"
            if curl --retry 2 -fsSL --max-time 20 -H 'Cache-Control: no-cache' "$BASE/?v=2.2-$GITHUB_RUN_ID-$attempt" -o /tmp/site.html && \
               curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "$BASE/assets/raf-prazo-22.js?v=2.2-$GITHUB_RUN_ID-$attempt" -o /tmp/legal22.js && \
               curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "$BASE/assets/tjrj-news.js?v=tjrj-ordem-$GITHUB_RUN_ID-$attempt" -o /tmp/tjrj-news.js && \
               grep -Fq 'id="rafRegime"' /tmp/site.html && \
               grep -Fq 'id="rafAct"' /tmp/site.html && \
               grep -Fq 'assets/raf-prazo-22.js' /tmp/site.html && \
               grep -Fq 'id="rafTabPending"' /tmp/site.html && \
               grep -Fq 'RafPrazoLegal22' /tmp/legal22.js && \
               grep -Fq 'Recebido/atualizado no Raf-Prazo' /tmp/tjrj-news.js && \
               grep -Fq 'content_changed_at' /tmp/tjrj-news.js && \
               grep -Fq 'id="rafProfileDialog"' /tmp/site.html && \
               grep -Fq 'id="rafProfileOpen"' /tmp/site.html && \
               grep -Fq 'id="rafCalendarSettings"' /tmp/site.html && \
               grep -Fq 'raf-22-primary-date' /tmp/site.html && \
               grep -Fq 'aspect-ratio:1/1' /tmp/site.html && \
               grep -Fq 'data-preset="jec_recurso"' /tmp/site.html && \
               grep -Fq 'data-preset="cpc_apelacao"' /tmp/site.html && \
               grep -Fq 'id="rafActList"' /tmp/site.html && \
               grep -Fq 'assets/raf-prazo-22.js?v=2.2.5' /tmp/site.html && \
               grep -Fq 'id="rafConditionalApply"' /tmp/site.html && \
               grep -Fq 'jec_embargos_titulo_judicial' /tmp/legal22.js && \
               grep -Fq 'jec_cumprimento_pagar' /tmp/legal22.js && \
               ! grep -Fq 'id="rafActSearch"' /tmp/site.html && \
               grep -Fq "groupOrder=['Recursos'" /tmp/legal22.js && \
               grep -Fq 'jec_preparo' /tmp/legal22.js && \
               grep -Fq 'cpc_impugnacao_525' /tmp/legal22.js && \
               grep -A 1 'class="raf-tabs" role="tablist"' /tmp/site.html | grep -Fq 'id="rafTabTjrj" data-raf-tab="tjrj"' && \
               grep -Fq 'aria-selected="true" aria-controls="rafPanelTjrj"' /tmp/site.html && \
               grep -Fq "chooseTab('tjrj');render();open(news)" /tmp/site.html && \
               grep -Fq '/* UX desktop: resultado e parâmetros à esquerda' /tmp/site.html && \
               grep -Fq '.workspace>.raf-22-parameters{grid-column:1;grid-row:2}' /tmp/site.html && \
               grep -Fq '.workspace>.raf-22-calendar{grid-column:2;grid-row:1 / span 3;align-self:start}' /tmp/site.html && \
               grep -Fq 'RAF-PRAZO 2.3 · FERRAMENTA JURÍDICA' /tmp/site.html && \
               grep -Fq 'grid-template-columns:minmax(0,44fr) minmax(0,56fr)' /tmp/site.html && \
               grep -Fq 'id="rafDayFocus"' /tmp/site.html && \
               grep -Fq 'id="rafDayFocusDetails"' /tmp/site.html && \
               grep -Fq 'function updateRafDayFocus(n)' /tmp/site.html && \
               ! grep -Fq 'id="calendarDue"' /tmp/site.html; then
              echo 'RAF_PRAZO_23_PUBLICADO_E_VALIDADO — 44/56, ficha do dia e vencimento único confirmados por HTTP'
              exit 0
            fi
            sleep 8
          done
          echo 'O GitHub Pages ainda não expõe todos os arquivos da versão 2.3' >&2
          exit 1
