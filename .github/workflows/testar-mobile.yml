name: Raf-Prazo - Mobile Browser
on:
  push:
    branches:
      - main
      - test/mobile-atualizacoes-20261017
    paths:
      - tests/test_updates_browser.py
      - .github/workflows/testar-mobile.yml
      - index.html
      - src/template.html
      - prazos/index.html
      - assets/prazos-home.js
      - assets/prazos-library.js
      - assets/prazos-library-shell.js
      - assets/prazos-library-shell.css
      - tests/browser_library_shell.py
      - assets/raf-prazo-22.js
      - tests/browser_22.py
      - assets/tjrj-news.js
      - assets/tjrj-optin.js
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Playwright e Chromium
        run: |
          python -m pip install 'playwright>=1.54,<2'
          python -m playwright install --with-deps chromium
      - name: Testar quatro larguras de viewport
        run: |
          python tests/test_updates_browser.py
          python tests/browser_22.py
          python tests/browser_library_shell.py
      - name: Guardar screenshots para revisão visual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: premium-raf-prazo-22
          path: |
            tests/screenshots-22/*.png
            tests/screenshots-library/*.png
          if-no-files-found: ignore
          retention-days: 5
