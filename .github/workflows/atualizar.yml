name: Raf-Prazo - Atualizar calendario
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/collect_tjrj.py
      - scripts/extract_tjrj.py
      - scripts/pdf_table_tjrj.py
      - scripts/sync.py
      - tests/test_extract_tjrj.py
      - tests/test_pdf_table_tjrj.py
      - tests/test_tjrj_markers.py
      - assets/tjrj-markers.js
      - .github/workflows/atualizar.yml
  schedule:
    - cron: '17 10 * * *'
permissions:
  contents: write
concurrency:
  group: raf-prazo-calendario
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencia de leitura de documentos oficiais em PDF
        run: python -m pip install 'pypdf>=5,<7'
      - name: Verificar sintaxe dos indicadores TJRJ
        run: node --check assets/tjrj-markers.js
      - name: Testes de seguranca e colecao
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Diagnosticar certificados TLS da origem oficial (sem ignorar validacao)
        run: |
          for host in www.tjrj.jus.br portaltj.tjrj.jus.br; do
            echo "Verificacao TLS: $host"
            timeout 12 bash -c "echo | openssl s_client -connect $host:443 -servername $host -showcerts 2>/dev/null" | openssl x509 -noout -subject -issuer -dates -fingerprint -sha256 || true
          done
      - name: Coletar documentos do TJRJ sem alterar prazos
        run: python scripts/collect_tjrj.py
      - name: Validar candidatos — jamais aptos a alterar contagem
        run: python scripts/collect_tjrj.py --check
      - name: Consultar feriados nacionais e incorporar candidatos pendentes
        run: python scripts/sync.py
      - name: Atualizar calendario incorporado
        run: python scripts/build_html.py
      - name: Validar artefatos
        run: |
          python -m json.tool feriados.json > /dev/null
          python -m json.tool dados/coleta-tjrj.json > /dev/null
          python - <<'PY'
          import json
          base=json.load(open('feriados.json',encoding='utf-8'))
          assert not any(e.get('type')=='SUSPENSAO_TJRJ' for e in base['events']), 'TJRJ nao pode atuar sem revisao'
          assert all(c.get('applies_to_deadlines') is False for c in base['candidates']), 'Candidato ativo'
          assert all(o.get('status')=='pending_review' and o.get('verified') is False and o.get('applies_to_deadlines') is False for c in base['candidates'] for o in (c.get('structured') or {}).get('occurrences', [])), 'Indicio extraido indevidamente ativo'
          PY
          test -s index.html
          grep -q rafEmbeddedBase index.html
      - name: Publicar alteracoes de calendario
        run: |
          git config user.name "raf-prazo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/coleta-tjrj.json feriados.json index.html src/template.html
          if ! git diff --cached --quiet; then
            git commit -m "chore: atualizar calendario judicial"
            for tentativa in 1 2 3; do
              if git push origin HEAD:main; then
                echo "Calendario publicado sem sobrescrever alteracoes concorrentes"
                exit 0
              fi
              echo "Conflito de atualizacao; buscando commits remotos - tentativa $tentativa"
              git fetch origin main
              git rebase origin/main || { git rebase --abort; echo "Conflito real: publicacao interrompida com seguranca"; exit 1; }
              sleep 3
            done
            echo "Nao foi possivel publicar o calendario apos 3 tentativas" >&2
            exit 1
          fi
